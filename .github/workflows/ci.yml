name: CI

on:
    pull_request: ~
    push:
        branches:
            - 1.x
        tags:
            - '*'
    schedule:
        - cron: 0 13 * * MON,TUE

jobs:
    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        if: github.event_name != 'schedule'
        steps:
            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, mysqli, pcre, pdo_mysql, zlib
                  coverage: pcov

            - name: Checkout
              uses: actions/checkout@v6
              with:
                  show-progress: false
                  persist-credentials: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v3

            - name: Generate the coverage report
              run: php -d pcov.enabled=1 vendor/bin/phpunit --coverage-clover=clover.xml

            - name: Upload the coverage report
              uses: codecov/codecov-action@v5
              with:
                  files: ./clover.xml
                  fail_ci_if_error: true
                  token: ${{ secrets.CODECOV_TOKEN }}

    coding-style:
        name: Coding Style
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.5
                  extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, pcre, pdo, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  show-progress: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v3

            - name: Install ECS
              uses: ramsey/composer-install@v3
              with:
                  working-directory: vendor-bin/ecs

            - name: Check the coding style
              run: vendor-bin/ecs/vendor/bin/ecs check --config vendor-bin/ecs/config/default.php --no-progress-bar --ansi

            - name: Install PHPStan
              uses: ramsey/composer-install@v3
              with:
                  working-directory: vendor-bin/phpstan

            - name: Analyze the code
              run: vendor-bin/phpstan/vendor/bin/phpstan analyse --no-progress

    tests:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest
        if: github.event_name != 'push'
        strategy:
            fail-fast: false
            matrix:
                php: [8.1, 8.2, 8.3, 8.4, 8.5]
        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, pcre, pdo_mysql, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  show-progress: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v3

            - name: Run the unit tests
              run: vendor/bin/phpunit --colors=always

    nightly:
        name: PHP 8.6
        runs-on: ubuntu-latest
        continue-on-error: true
        if: github.event_name != 'push'
        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.6
                  extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, pcre, pdo_mysql, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  show-progress: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v3
              with:
                  composer-options: --ignore-platform-req=php+

            - name: Run the unit tests
              run: vendor/bin/phpunit --colors=always

    prefer-lowest:
        name: Prefer Lowest ${{ matrix.php }}
        runs-on: ubuntu-latest
        if: github.event_name != 'push'
        strategy:
            fail-fast: false
            matrix:
                php: [8.1, 8.4, 8.5]
        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, pcre, pdo_mysql, zlib
                  coverage: none

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  show-progress: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v3
              with:
                  dependency-versions: lowest

            - name: Run the unit tests
              run: vendor/bin/phpunit --colors=always

    windows:
        name: Windows ${{ matrix.php }}
        runs-on: windows-latest
        if: github.event_name != 'push'
        strategy:
            fail-fast: false
            matrix:
                php: [8.1, 8.2, 8.3, 8.4, 8.5]
        steps:
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, fileinfo, filter, gd, hash, intl, json, mbstring, pcre, pdo_mysql, zlib
                  ini-values: memory_limit=1G
                  coverage: none

            - name: Adjust the Git autocrlf setting
              run: git config --global core.autocrlf false

            - name: Checkout
              uses: actions/checkout@v4
              with:
                  show-progress: false

            - name: Install the dependencies
              uses: ramsey/composer-install@v3

            - name: Run the unit tests
              run: vendor/bin/phpunit.bat --colors=always
